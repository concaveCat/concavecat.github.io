      function initThemeAndLiquid() {
        // 1. 主题初始化逻辑
        const initialColorScheme = ""; // "light" | "dark"
        const currentTheme = localStorage.getItem("theme");
        function getPreferTheme() {
          if (currentTheme) return currentTheme;
          if (initialColorScheme) return initialColorScheme;
          return window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light";
        }
        const themeValue = getPreferTheme();
        document.firstElementChild?.setAttribute("data-theme", themeValue);

        // 2. 液态玻璃初始化逻辑
        const isLiquid = localStorage.getItem("liquid-glass") === "true";
        document.firstElementChild?.classList.add("group/html"); // 确保 Tailwind 状态透传
        document.firstElementChild?.setAttribute("data-liquid", isLiquid ? "true" : "false");

        // 3. 暴露给外部的全局 API
        window.theme = {
          themeValue: themeValue,
          getTheme: () => window.theme.themeValue,
          setTheme: val => {
            window.theme.themeValue = val;
          },
        };
      }

      // 页面初次硬加载时执行一次（防止闪烁）
      initThemeAndLiquid();

      // 核心修复：监听 Astro 的页面替换事件。每次无刷新路由跳转后，重新挂载状态！
      document.addEventListener("astro:after-swap", initThemeAndLiquid);
